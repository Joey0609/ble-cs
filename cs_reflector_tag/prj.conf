# Connected reflector and Ranging Service responder on the cs_roles library.
CONFIG_BT=y
CONFIG_BT_SMP=y
# Pair for link encryption only; CS security needs no stored bond.
CONFIG_BT_BONDABLE=n
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
# Base name; main.c removes spaces and appends the identity address. A planner
# export may replace it (up to 10 bytes without spaces).
CONFIG_BT_DEVICE_NAME="CSTag"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=32
CONFIG_BT_MAX_CONN=1
# cs_roles advertises with extended advertising, which carries the whole name.
CONFIG_BT_EXT_ADV=y
CONFIG_BT_CTLR_ADV_DATA_LEN_MAX=64
CONFIG_BT_CHANNEL_SOUNDING=y
CONFIG_BT_CHANNEL_SOUNDING_TEST=n
CONFIG_BT_TRANSMIT_POWER_CONTROL=y

# ATT MTU and buffers of the NCS ras_reflector sample.
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_ATT_PREPARE_COUNT=3
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
# TEST_PHY is 2M.
CONFIG_BT_CTLR_PHY_2M=y

# Ranging Service responder only. cs_roles allocates the instance at START and
# frees it from its own thread on link down, as in cs_client. The automatic
# instance is freed in the disconnected callback on the system work queue,
# which drains the RAS work queue there and runs before cs_roles' callback: if
# the drain stalls, cs_roles never sees the disconnection, the connection
# object is never released and the Tag stays unconnectable without an error.
CONFIG_BT_RAS_RRSP_AUTO_ALLOC_INSTANCE=n
CONFIG_BT_RAS_RRSP_MAX_ACTIVE_CONN=1
# Diagnostic (2026-09-23, §3.3): 1 leaves no headroom, so a single ranging-data
# buffer that is never freed latches the responder into "Failed to allocate
# buffer for procedure N" for good. 4 tells the two cases apart: a one-time loss
# keeps running on the rest, a repeating leak degrades in steps. Range is 1-10.
CONFIG_BT_RAS_RRSP_RD_BUFFERS_PER_CONN=4
# The initiator chooses the step modes; support mode 3 so any planner
# configuration can run against this reflector.
CONFIG_BT_RAS_MODE_3_SUPPORTED=y
CONFIG_BT_RAS_MAX_ANTENNA_PATHS=4

CONFIG_BT_CTLR_CHANNEL_SOUNDING=y
CONFIG_BT_CTLR_CHANNEL_SOUNDING_TEST=n
CONFIG_BT_CTLR_SDC_CS_ROLE_REFLECTOR_ONLY=y
CONFIG_BT_CTLR_SDC_CS_STEP_MODE3=y

# Connection, CS and RAS sequencing shared with the other applications; it
# selects BT_RAS and BT_RAS_RRSP.
CONFIG_APP_CS_ROLES=y
CONFIG_APP_CS_ROLES_REFLECTOR=y
# Planner export interface (config/cs_generated_config.c or
# -DCS_CONFIG_SOURCE); weak defaults without one.
CONFIG_APP_CS_GENERATED_CONFIG=y

# Application log; levels from the planner export. The configuration dump at
# boot is one message per line, queued before the log thread first runs.
CONFIG_APP_LOG=y
CONFIG_APP_LOG_QUEUE_DEPTH=32

# Shared app_libs requires CRC for cs_protocol.
CONFIG_CRC=y
CONFIG_ASSERT=y
# Recovery from advertising that no longer restarts: the Tag has no button.
CONFIG_REBOOT=y
CONFIG_MAIN_STACK_SIZE=4096

# The Tag has no native USB or on-board debug UART bridge. Use an SWD probe
# with RTT; deferred, nonblocking logging lets it operate without a viewer.
CONFIG_SERIAL=n
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

# Two physical antennas; up to four paths when both peers have two antennas.
# NUM_ANTENNAS > 1 selects the SDK's CS switch callback and GPIO support.
CONFIG_BT_CTLR_SDC_CS_NUM_ANTENNAS=2
CONFIG_BT_CTLR_SDC_CS_MAX_ANTENNA_PATHS=4

# IPT is carried in the shared CS creation parameters. The Extended Feature
# Set is required by the Nordic controller for CS enhancement bits.
CONFIG_BT_CTLR_EXTENDED_FEAT_SET=y

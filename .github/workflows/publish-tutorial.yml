name: Publish tutorial presentation

on:
  # Manual runs only: publish from Actions → Run workflow on main.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare tutorial site
        run: |
          mkdir -p _site/ipin2026-tutorial
          cp -R docs/tutorial-IPIN2026/. _site/ipin2026-tutorial/
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="zh-CN">
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=./ipin2026-tutorial/">
              <title>IPIN 2026 中文教程</title>
            </head>
            <body>
              <p><a href="./ipin2026-tutorial/">打开 IPIN 2026 中文演示稿</a></p>
            </body>
          </html>
          EOF

      - name: Upload tutorial site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Publish ble-channel-sounding to PyPI

on:
  release:
    types: [published]
  # Manual runs build and check the package without publishing it.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'ble-channel-sounding-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Qt runtime library
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check package and release versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          from ble_channel_sounding import __version__

          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          version = project['version']
          if __version__ != version:
              raise SystemExit(f'ble_channel_sounding.__version__ ({__version__}) != project.version ({version})')
          tag = os.environ['RELEASE_TAG']
          if os.environ['GITHUB_EVENT_NAME'] == 'release' and tag != f'ble-channel-sounding-v{version}':
              raise SystemExit(f'Release tag must be ble-channel-sounding-v{version}, got {tag!r}')
          PY

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build wheel and source distribution
        run: |
          python -m build
          python -m twine check --strict dist/*
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import tarfile
          import zipfile

          wheels = list(Path('dist').glob('*.whl'))
          source_dists = list(Path('dist').glob('*.tar.gz'))
          if len(wheels) != 1 or len(source_dists) != 1:
              raise SystemExit('Expected exactly one wheel and one source distribution')

          with zipfile.ZipFile(wheels[0]) as wheel:
              wheel_files = wheel.namelist()
          with tarfile.open(source_dists[0], 'r:gz') as source_dist:
              source_files = source_dist.getnames()

          for archive, names in ((wheels[0], wheel_files), (source_dists[0], source_files)):
              if any('ble_channel_sounding_planner' in PurePosixPath(name).parts for name in names):
                  raise SystemExit(f'Standalone planner found in {archive.name}')
          PY

      - name: Install wheel
        run: python -m pip install dist/*.whl

      - name: Check installed package
        # Isolated mode avoids importing the source checkout.
        run: |
          python -m pip check
          python -I - <<'PY'
          from importlib.metadata import distribution
          from importlib.resources import files
          from pathlib import Path

          from ble_channel_sounding.config_files import configs_directory

          dist = distribution('ble-channel-sounding')
          scripts = {ep.name: ep for ep in dist.entry_points if ep.group == 'console_scripts'}
          if set(scripts) != {'ble-channel-sounding'}:
              raise SystemExit(f'Unexpected console scripts: {sorted(scripts)}')
          if scripts['ble-channel-sounding'].value != 'ble_channel_sounding.app:main':
              raise SystemExit('Unexpected ble-channel-sounding entry point')
          packaged_files = dist.files or ()
          if any(str(path).startswith('ble_channel_sounding_planner/') for path in packaged_files):
              raise SystemExit('Standalone planner package must not be included in this distribution')
          for resource in ('GETTING_STARTED.md', 'GETTING_STARTED.html', 'assets/logo/senswear-logo.png'):
              if not files('ble_channel_sounding').joinpath(resource).is_file():
                  raise SystemExit(f'Missing package resource: {resource}')
          configs = configs_directory()
          for source in [*Path('configs').glob('*.json'), *Path('configs').glob('*.c')]:
              if not (configs / source.name).is_file() or (configs / source.name).read_bytes() != source.read_bytes():
                  raise SystemExit(f'Missing or outdated example configuration: {source.name}')
          PY
          ble-channel-sounding --help

      - name: Store distributions
        uses: actions/upload-artifact@v7
        with:
          name: ble-channel-sounding-distributions
          path: python/dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/ble-channel-sounding
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: ble-channel-sounding-distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1

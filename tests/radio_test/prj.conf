# Direct radio access: no Bluetooth stack, no MPSL. See src/README.md.
CONFIG_DYNAMIC_INTERRUPTS=y
CONFIG_NRFX_TIMER=y
CONFIG_NRFX_GPPI=y
CONFIG_CLOCK_CONTROL=y

# radio_test.c seeds its transmit pattern from the entropy driver.
CONFIG_ENTROPY_GENERATOR=y
CONFIG_PSA_CRYPTO=y

# Provides <fem_al/fem_al.h>, which radio_test.h includes unconditionally.
# CONFIG_FEM stays off on a bare DK, so no FEM code is built.
CONFIG_FEM_AL_LIB=y

# CRC-32 required by the shared cs_protocol library in app_libs.
CONFIG_CRC=y

CONFIG_ASSERT=y

CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_BOOT_BANNER=n

CONFIG_MAIN_STACK_SIZE=2048

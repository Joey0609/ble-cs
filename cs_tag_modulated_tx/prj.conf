# Direct radio access; Bluetooth/MPSL and this application cannot coexist.
CONFIG_DYNAMIC_INTERRUPTS=y
CONFIG_NRFX_TIMER=y
CONFIG_NRFX_GPPI=y
CONFIG_CLOCK_CONTROL=y

# NCS radio_test driver dependencies.
CONFIG_ENTROPY_GENERATOR=y
CONFIG_PSA_CRYPTO=y
CONFIG_FEM_AL_LIB=y
CONFIG_CRC=y
CONFIG_ASSERT=y

# nRF54L15 Tag has no native USB or debug UART bridge; use RTT over SWD.
CONFIG_SERIAL=n
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
CONFIG_BOOT_BANNER=n

CONFIG_MAIN_STACK_SIZE=2048

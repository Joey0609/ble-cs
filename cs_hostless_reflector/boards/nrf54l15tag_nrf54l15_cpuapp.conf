# nRF54L15 Tag: two antennas through the SKY13348 switch (overlay), up to four
# paths with a two-antenna initiator. Settings follow tests/cs_reflector_tag.
CONFIG_BT_CTLR_SDC_CS_NUM_ANTENNAS=2
CONFIG_BT_CTLR_SDC_CS_MAX_ANTENNA_PATHS=4

# No native USB or on-board debug UART bridge: log over RTT with an SWD probe;
# deferred, nonblocking logging runs without a viewer.
CONFIG_SERIAL=n
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

# CS reflector without a host: advertises, accepts the initiator, runs the
# configuration from the planner export (or the cs_utils defaults) and logs
# state changes and counters on the debug UART. No USB, no host link.

CONFIG_BT=y
# Base name; main.c removes spaces and appends the Bluetooth identity address.
CONFIG_BT_DEVICE_NAME="CSReflector"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=32
CONFIG_BT_MAX_CONN=1
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
# Pair for link encryption only; CS security needs no stored bond.
CONFIG_BT_BONDABLE=n
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
CONFIG_BT_EXT_ADV=y
CONFIG_BT_CTLR_ADV_DATA_LEN_MAX=64

CONFIG_BT_CHANNEL_SOUNDING=y
CONFIG_BT_CHANNEL_SOUNDING_TEST=n
CONFIG_BT_TRANSMIT_POWER_CONTROL=y

# ATT MTU and buffers of the NCS ras_reflector sample.
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_ATT_PREPARE_COUNT=3
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_CTLR_PHY_2M=y

# Ranging Service responder only, as on the Tag: cs_roles allocates the
# instance at START and frees it from its own thread on link down. The
# automatic instance is freed in the disconnected callback on the system work
# queue, before cs_roles' callback: if its RAS drain stalls, the link is never
# released and the reflector stays unconnectable without an error.
CONFIG_BT_RAS_RRSP_AUTO_ALLOC_INSTANCE=n
CONFIG_BT_RAS_RRSP_MAX_ACTIVE_CONN=1
# Headroom for a ranging-data buffer that is not freed (Tag diagnostic, §3.3).
CONFIG_BT_RAS_RRSP_RD_BUFFERS_PER_CONN=4
CONFIG_BT_RAS_MODE_3_SUPPORTED=y
CONFIG_BT_RAS_MAX_ANTENNA_PATHS=4

CONFIG_BT_CTLR_CHANNEL_SOUNDING=y
CONFIG_BT_CTLR_CHANNEL_SOUNDING_TEST=n
CONFIG_BT_CTLR_SDC_CS_ROLE_REFLECTOR_ONLY=y
CONFIG_BT_CTLR_SDC_CS_STEP_MODE3=y
CONFIG_BT_CTLR_SDC_CS_MAX_ANTENNA_PATHS=4
CONFIG_BT_CTLR_SDC_CS_NUM_ANTENNAS=1
CONFIG_BT_CTLR_EXTENDED_FEAT_SET=y

CONFIG_APP_CS_ROLES=y
CONFIG_APP_CS_ROLES_REFLECTOR=y
CONFIG_APP_CS_GENERATED_CONFIG=y

# app_libs always builds cs_protocol (unused here and removed by the linker).
CONFIG_CRC=y
CONFIG_ASSERT=y
CONFIG_GPIO=y
CONFIG_MAIN_STACK_SIZE=2048

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=2048

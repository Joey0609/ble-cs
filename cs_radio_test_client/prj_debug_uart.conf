# Host protocol uses uart20 directly. Disable console output on that UART so
# printk / Zephyr logs cannot corrupt the binary host-link stream.
CONFIG_UART_20_INTERRUPT_DRIVEN=y
CONFIG_UART_20_ASYNC=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_PRINTK=n
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_BOOT_BANNER=n

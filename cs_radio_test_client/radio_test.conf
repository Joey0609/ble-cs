# Direct radio access; Bluetooth and MPSL cannot own these peripherals.
CONFIG_BT=n

CONFIG_DYNAMIC_INTERRUPTS=y
CONFIG_NRFX_TIMER=y
CONFIG_NRFX_GPPI=y
CONFIG_CLOCK_CONTROL=y

# The NCS radio-test sample seeds its transmit pattern from the entropy driver.
CONFIG_ENTROPY_GENERATOR=y
CONFIG_PSA_CRYPTO=y

# radio_test.h includes fem_al.h even when the board has no physical FEM.
CONFIG_FEM_AL_LIB=y

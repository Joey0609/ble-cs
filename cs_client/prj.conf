# Bluetooth build (default): CS initiator and CS reflector in one image, the
# role chosen by the host at runtime, with both Ranging Service roles for
# real-time ranging data. Settings shared with the radio
# test build are in common.conf. Where the NCS ras_initiator and ras_reflector
# samples differ, the larger value is used.

# Host link on native USB CDC ACM (app.overlay), enabled without waiting for a
# host; DTR tracks the host port (CONFIG_APP_HOST_LINK_DTR follows the class).
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_ENABLE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="CS Client"
CONFIG_USBD_CDC_ACM_BUF_POOL=y
CONFIG_USBD_CDC_ACM_WORKQUEUE=y

CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="CS Client"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=32
CONFIG_BT_MAX_CONN=1
# GAP role follows the configuration: central scans, peripheral advertises.
CONFIG_BT_CENTRAL=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
# Pair for link encryption only; CS security needs no stored bond.
CONFIG_BT_BONDABLE=n
# Connection parameters come from the applied configuration.
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
CONFIG_BT_GATT_CLIENT=y
# Start the ATT MTU exchange on connection, as cs_hostless_initiator does: without it a
# hosted link stays at the ATT default 23 and the RAS responder segments the ranging data
# into ~39 notifications per procedure instead of 2 (§12.4).
CONFIG_BT_GATT_AUTO_UPDATE_MTU=y
CONFIG_BT_GATT_DYNAMIC_DB=y

CONFIG_BT_CHANNEL_SOUNDING=y
CONFIG_BT_CHANNEL_SOUNDING_TEST=n
# Lets CS and ACL use different PHYs.
CONFIG_BT_TRANSMIT_POWER_CONTROL=y

# The Ranging Profile recommends an ATT MTU of at least 247 octets.
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_ATT_PREPARE_COUNT=3
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_CTLR_PHY_2M=y

# Ranging Service: responder (CS reflector role) and requestor (CS initiator role).
CONFIG_BT_RAS=y
CONFIG_BT_RAS_MODE_3_SUPPORTED=y
CONFIG_BT_RAS_MAX_ANTENNA_PATHS=4
CONFIG_BT_RAS_RRSP=y
# The RRSP instance is allocated only in the reflector role.
CONFIG_BT_RAS_RRSP_AUTO_ALLOC_INSTANCE=n
CONFIG_BT_RAS_RRSP_MAX_ACTIVE_CONN=1
CONFIG_BT_RAS_RRSP_RD_BUFFERS_PER_CONN=1
CONFIG_BT_RAS_RREQ=y
CONFIG_BT_RAS_RREQ_MAX_ACTIVE_CONN=1

# SoftDevice Controller with both CS roles, mode 3 and up to 4 antenna paths.
# One local antenna on the DK; the paths come from a multi-antenna peer.
CONFIG_BT_CTLR_CHANNEL_SOUNDING=y
CONFIG_BT_CTLR_CHANNEL_SOUNDING_TEST=n
CONFIG_BT_CTLR_SDC_CS_ROLE_BOTH=y
CONFIG_BT_CTLR_SDC_CS_STEP_MODE3=y
CONFIG_BT_CTLR_SDC_CS_MAX_ANTENNA_PATHS=4
CONFIG_BT_CTLR_SDC_CS_NUM_ANTENNAS=1
# CS enhancements such as IPT need the LL Extended Feature Set.
CONFIG_BT_CTLR_EXTENDED_FEAT_SET=y

# Carry the complete configured name in extended advertising.
CONFIG_BT_EXT_ADV=y
CONFIG_BT_CTLR_ADV_DATA_LEN_MAX=64
CONFIG_BT_EXT_SCAN_BUF_SIZE=1650
# Connection, CS and RAS sequencing in both roles (common/libs/cs_roles).
CONFIG_APP_CS_ROLES=y
CONFIG_APP_CS_ROLES_INITIATOR=y
CONFIG_APP_CS_ROLES_REFLECTOR=y

# Radio test build: direct radio access, no Bluetooth stack and no MPSL.
# Used instead of prj.conf with -DFILE_SUFFIX=radio_test; settings shared with
# the Bluetooth build are in common.conf. See README.md.
CONFIG_BT=n

# Host link on uart30 (app_radio_test.overlay), not USB: no USB device stack.
# A hardware UART has no DTR, so a host session ends only with CLOSE_SESSION.
CONFIG_UART_30_INTERRUPT_DRIVEN=y

CONFIG_DYNAMIC_INTERRUPTS=y
CONFIG_NRFX_TIMER=y
CONFIG_NRFX_GPPI=y
CONFIG_CLOCK_CONTROL=y

# radio_test.c seeds its transmit pattern from the entropy driver.
CONFIG_ENTROPY_GENERATOR=y
CONFIG_PSA_CRYPTO=y

# Provides <fem_al/fem_al.h>, which radio_test.h includes unconditionally.
# CONFIG_FEM stays off on a bare DK, so no FEM code is built.
CONFIG_FEM_AL_LIB=y

# CS protocol client, settings shared by both builds; CMakeLists.txt adds this
# file to prj.conf or prj_radio_test.conf. Protocol frames on USB CDC ACM
# (Bluetooth build) or uart30 (radio test build), logs on the debug UART. See
# README.md.

CONFIG_APP_HOST_LINK=y
CONFIG_ASSERT=y
CONFIG_MAIN_STACK_SIZE=2048
# State changes raised from work items format their log message on the system work queue.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Console on the debug UART; never mixed into the protocol stream. The app_log
# console consumer uses printk, which LOG_PRINTK passes through the deferred
# log with the Zephyr subsystem messages. Levels are set by SET_LOG_CONFIG.
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD=y
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_UART_ASYNC=y
CONFIG_LOG_BACKEND_UART_BUFFER_SIZE=256

# The host link UART needs the interrupt API, but uart20 uses asynchronous UARTE DMA.
CONFIG_UART_ASYNC_API=y
CONFIG_UART_20_INTERRUPT_DRIVEN=n
CONFIG_UART_20_ASYNC=y
CONFIG_BOOT_BANNER=n

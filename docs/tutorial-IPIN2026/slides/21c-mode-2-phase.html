  <aside class="notes">
    <p> 发起端传输单音信号，反射端测量相位；然后角色互换。所选的天线配置定义了路径，每个路径都需要一个明确定义的测量槽。规划器包括切换周期和扩展时隙，包括当不存在传输时的保留持续时间。该应用程序将该扩展槽排除在正常天线路径测量之外。组合和比较阶段时保持路径同一性；不同的路径可以有不同的硬件偏差和传播。 </p>

<section data-timing="120">
  <h2>同一电子平台，多种应用形态</h2>
  <div class="content">
    <div class="cols">
      <div>
        <div class="photo-frame">
          <img src="images/ring.jpg" alt="SensWear 平台照片" />
        </div>
      </div>
      <div>
        <div class="equations">
          <div class="card">
            <span class="n">核心</span>
            <h3>无线通信 + 运动感知 + 供电</h3>
            <p>复用统一的软硬件基础。</p>
          </div>
          <div class="card">
            <span class="n">模块</span>
            <h3>感知或驱动</h3>
            <p>按实验需求更换子板。</p>
          </div>
          <div class="card">
            <span class="n">外壳</span>
            <h3>戒指 · 贴片 · 固定节点</h3>
            <p>根据研究问题选择佩戴或部署位置。</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="source">
    <a href="https://sens-wear.com/" target="_blank" rel="noopener">SensWear平台</a>
  </div>
  <aside class="notes"><p>解释电子平台、功能模块和外壳的分工。戒指是教程标题采用的外形，但不代表整个平台只能做戒指；相同设计也可用于人体佩戴传感器、附着在物体上的模块或墙面固定节点。部署位置改变会影响天线环境，外壳与人体影响需要重新测量。功能模块不会自动成为定位基站：只有测定其坐标并配置适当固件角色后，才能作为基站使用。本页简要介绍这些区别，再引出众筹与项目进展。</p></aside>

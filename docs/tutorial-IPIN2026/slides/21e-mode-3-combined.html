  <aside class="notes">
    <p> 详细了解规划器中使用的确切概念顺序：发起端同步数据包，然后是其单音信号，收发周转，反射端单音信号，然后是其同步数据包。这里没有绘制保护期。模式三并不能保证添加两个估计器会产生完美的测距，并且主机不会仅仅因为两条迹线都可用而自动实现稳健的融合估计器。它提供了一种方便的方法来检查相关交换的时序和相位证据，其空口占用时间成本与仅单音信号步骤不同。 </p>

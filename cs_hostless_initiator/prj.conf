# CS initiator without a command host: scans for a peer matching the planner's
# name patterns (or advertising the Ranging Service), connects, runs the
# generated configuration (or application defaults), and emits binary protocol
# reports over report-only USB CDC.

CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="CS Hostless Initiator"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=32
CONFIG_BT_MAX_CONN=1
CONFIG_BT_CENTRAL=y
CONFIG_BT_SMP=y
# The hostless devices have no passkey/OOB UI; allow LE Secure Connections
# Just Works pairing for the encryption-only link.
CONFIG_BT_SMP_ENFORCE_MITM=n
# Pair for link encryption only; CS security needs no stored bond.
CONFIG_BT_BONDABLE=n
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
CONFIG_BT_GATT_CLIENT=y
# Without an ATT MTU exchange RAS segments carry 19 bytes: one procedure of 72
# PBR steps needs ~39 notifications and cannot drain in the single ACL event
# between procedures. At MTU 498 it takes three LL PDUs.
CONFIG_BT_GATT_AUTO_UPDATE_MTU=y
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_EXT_ADV=y
CONFIG_BT_EXT_SCAN_BUF_SIZE=1650

# Report-only USB CDC ACM. The application never starts the APP_HOST_LINK
# command thread, so opening the port cannot enable, stop or control the radio.
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_ENABLE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="CS Hostless Initiator"
CONFIG_USBD_CDC_ACM_BUF_POOL=y
CONFIG_USBD_CDC_ACM_WORKQUEUE=y
CONFIG_RING_BUFFER=y
CONFIG_RING_BUFFER_LARGE=y
CONFIG_UART_ASYNC_API=y
CONFIG_UART_20_INTERRUPT_DRIVEN=n
CONFIG_UART_20_ASYNC=y

CONFIG_BT_CHANNEL_SOUNDING=y
CONFIG_BT_CHANNEL_SOUNDING_TEST=n
CONFIG_BT_TRANSMIT_POWER_CONTROL=y

# ATT MTU and buffers of the NCS ras_initiator sample.
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_ATT_PREPARE_COUNT=3
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_CTLR_PHY_2M=y

# Ranging Service requestor only, with real-time ranging data.
CONFIG_BT_RAS_RREQ_MAX_ACTIVE_CONN=1
CONFIG_BT_RAS_MODE_3_SUPPORTED=y
CONFIG_BT_RAS_MAX_ANTENNA_PATHS=4

CONFIG_BT_CTLR_CHANNEL_SOUNDING=y
CONFIG_BT_CTLR_CHANNEL_SOUNDING_TEST=n
CONFIG_BT_CTLR_SDC_CS_ROLE_INITIATOR_ONLY=y
CONFIG_BT_CTLR_SDC_CS_STEP_MODE3=y
CONFIG_BT_CTLR_SDC_CS_MAX_ANTENNA_PATHS=4
CONFIG_BT_CTLR_SDC_CS_NUM_ANTENNAS=1
CONFIG_BT_CTLR_EXTENDED_FEAT_SET=y

CONFIG_APP_CS_ROLES=y
CONFIG_APP_CS_ROLES_INITIATOR=y
CONFIG_APP_CS_GENERATED_CONFIG=y

# Shared binary protocol report encoders and CDC transport. The application
# calls host_link_report_only_init(), never host_link_init().
CONFIG_APP_HOST_LINK=y
CONFIG_APP_HOST_LINK_DTR=y
CONFIG_APP_HOST_LINK_TX_BUF_SIZE=16384

# app_libs always builds cs_protocol (unused here and removed by the linker).
CONFIG_CRC=y
CONFIG_ASSERT=y
CONFIG_MAIN_STACK_SIZE=2048

# Console and log on the DK's debug UART (uart20, 921600 baud in the board
# overlay), never RTT.
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_USE_SEGGER_RTT=n
CONFIG_RTT_CONSOLE=n

CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=2048

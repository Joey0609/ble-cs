[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "ble-channel-sounding"
version = "0.1.1"
description = "Host application for BLE Channel Sounding clients: configuration, results, FAE and run recording"
readme = "ble_channel_sounding/GETTING_STARTED.md"
license = "MIT"
license-files = ["LICENSE", "LICENSE-DOCS.md"]
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6,<7",
    "pyqtgraph>=0.13.7,<0.15",
    "pyserial>=3.5",
    "h5py>=3.10",
    "numpy>=1.25",
    "scipy>=1.10",
]

[project.optional-dependencies]
mat73 = ["hdf5storage"]

[project.scripts]
ble-channel-sounding = "ble_channel_sounding.app:main"

[project.urls]
Source = "https://github.com/Sens-Wear/ble-cs"
Documentation = "https://github.com/Sens-Wear/ble-cs/blob/main/python/ble_channel_sounding/GETTING_STARTED.md"

[tool.setuptools]
packages = [
    "ble_channel_sounding",
    "ble_channel_sounding.planner",
    "ble_channel_sounding.protocol",
    "ble_channel_sounding.views",
    "ble_channel_sounding.configs",
]
include-package-data = false

[tool.setuptools.package-dir]
"ble_channel_sounding.configs" = "configs"

[tool.setuptools.package-data]
ble_channel_sounding = ["GETTING_STARTED.md", "GETTING_STARTED.html", "assets/logo/senswear-logo.png", "assets/help/*.png"]
"ble_channel_sounding.configs" = ["*.json", "*.c", "README.md"]
